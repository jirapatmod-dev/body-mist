<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ขอบคุณสำหรับคำสั่งซื้อ | Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ---------- เฉพาะหน้าขอบคุณ ---------- */
    .thanks {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 77px - 150px);
      padding: var(--space-6) var(--space-3);
      text-align: center;
    }

    .thanks__inner {
      max-width: 560px;
    }

    .thanks p {
      margin-left: auto;
      margin-right: auto;
      margin-bottom: var(--space-4);
    }

    @media (max-width: 640px) {
      .thanks {
        padding: var(--space-5) var(--space-2);
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main class="thanks">
    <div class="thanks__inner">
      <h1>ขอบคุณสำหรับคำสั่งซื้อ</h1>
      <hr class="rule">
      <p class="lead">เราได้รับคำสั่งซื้อของคุณเรียบร้อยแล้ว ทางร้านจะติดต่อกลับตามเบอร์โทรหรือ Line ที่คุณแจ้งไว้</p>
      <a class="btn" href="index.html">กลับหน้าแรก</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>&copy; 2026 Body Scent</span>
      <nav class="nav" aria-label="เมนูท้ายหน้า">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
